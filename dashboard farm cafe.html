<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>몽글 농장 카페 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap">
<style>
:root{--bg:#f6ebdf;--card:#fffaf3;--ink:#7a5a48;--mute:#b0927e;--acc:#e3b08f;--acc2:#f2b8c4;--line:#ecd7c3;--soft:#fbeedd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2c211b;--card:#3b2d25;--ink:#f3e0d0;--mute:#c4a590;--acc:#c98d68;--acc2:#c88a98;--line:#58433a;--soft:#46352c}}
:root[data-theme="dark"]{--bg:#2c211b;--card:#3b2d25;--ink:#f3e0d0;--mute:#c4a590;--acc:#c98d68;--acc2:#c88a98;--line:#58433a;--soft:#46352c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jua","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:15px}
img{display:block;-webkit-user-drag:none;user-select:none}.wrap{max-width:1180px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:2px 0 10px;text-align:center;letter-spacing:.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.st{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:8px}.st img{width:30px;height:30px;object-fit:contain}.st small{display:block;color:var(--mute);font-size:12px}.st b{font-size:19px;font-weight:400}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:2px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.dash{display:grid;gap:10px;grid-template-columns:1fr}.col{display:flex;flex-direction:column;gap:10px;min-width:0}.mid{order:-1}
@media(min-width:760px){.dash{grid-template-columns:250px 1fr}.mid{order:0}.col:last-child{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr)}}
@media(min-width:1080px){.dash{grid-template-columns:250px 1fr 270px}.col:last-child{display:flex;grid-column:auto}}
.pn{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:10px 12px}.pn h2{font-size:16px;font-weight:400;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.clk{text-align:center;background:var(--soft);border-radius:16px;padding:8px}.clk b{font-size:30px;font-weight:400;display:block}.clk small{color:var(--mute)}
textarea,input{font:inherit;font-family:"Gaegu","Jua",sans-serif;font-size:17px;color:var(--ink);background:var(--soft);border:2px dashed var(--acc);border-radius:14px;padding:6px 10px;width:100%;outline:0}
textarea{height:110px;resize:none;line-height:1.5;background:repeating-linear-gradient(var(--soft) 0 25px,var(--line) 25px 26px)}
.add{display:flex;gap:6px;margin-bottom:6px}.add input{flex:1;width:auto}
button{font:inherit;border:0;border-radius:12px;background:var(--acc);color:#fff;padding:5px 12px;cursor:pointer}button:disabled{opacity:.45;cursor:default}
.td{display:flex;align-items:center;gap:8px;padding:4px 2px;font-family:"Gaegu","Jua",sans-serif;font-size:18px}.td span{flex:1;cursor:pointer}.td.d span{text-decoration:line-through;opacity:.55}.td i{width:20px;height:20px;border-radius:7px;border:2px solid var(--acc);flex:none;text-align:center;line-height:15px;font-style:normal;color:#fff;cursor:pointer}.td.d i{background:var(--acc)}.td u{text-decoration:none;color:var(--mute);cursor:pointer}
.q{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}.q.d{opacity:.55}
.fb{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.fb::-webkit-scrollbar{display:none}
.cd{flex:1;min-width:74px;background:var(--soft);border:3px solid transparent;border-radius:16px;padding:5px 3px;text-align:center;font-size:12px;cursor:pointer}.cd img{width:32px;height:32px;object-fit:contain;margin:0 auto 1px}.cd.on{border-color:var(--acc2);background:var(--card)}.cd.dim{opacity:.5}.cd small{color:var(--mute);display:block}
#farm{position:relative;border-radius:18px;overflow:hidden;background-size:56px;padding:128px 0 10px;min-height:340px}
#deco{position:absolute;top:6px;left:0;right:0;height:114px;pointer-events:none}#deco img{position:absolute;bottom:0}
#plots{width:min(92%,360px);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plot{aspect-ratio:1;border-radius:16px;border:3px solid rgba(110,70,50,.35);background-size:cover;position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.plot img.s{width:60%;height:60%;object-fit:contain}.plot.ripe img.s{width:78%;height:78%;animation:bn .8s infinite alternate}.plot .w{position:absolute;top:2px;left:2px;width:20px}.plot .pg{position:absolute;bottom:4px;left:12%;right:12%;height:5px;border-radius:3px;background:rgba(255,255,255,.6);overflow:hidden}.pg i{display:block;height:100%;background:var(--acc2)}
.gold{filter:sepia(1) saturate(4) hue-rotate(5deg) drop-shadow(0 0 6px #ffd24d)}@keyframes bn{to{transform:translateY(-5px) scale(1.06)}}
#cafe{position:relative;height:300px;border-radius:18px;overflow:hidden;background:linear-gradient(#f3d3c0 0 24%,transparent 24%),repeating-conic-gradient(#fff4e4 0 25%,#f9e3cc 0 50%) 0 0/48px 48px}
.sign{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#fffaf3;border:2px solid var(--acc);border-radius:14px;padding:1px 12px;color:#a8704c;white-space:nowrap}
.tbl{position:absolute;width:72px;height:46px;border-radius:50%;background:#fff4e2;border:3px solid #e3c4a2;transform:translate(-50%,-30%);z-index:1}
.cust{position:absolute;transform:translate(-50%,-88%);z-index:2;transition:left 1.4s linear,top 1.4s linear}.cust img.c{width:64px}.cust.walk img.c{animation:wk .35s infinite alternate}@keyframes wk{to{transform:translateY(-5px) rotate(4deg)}}
.bub{position:absolute;top:-30px;right:-30px;background:#fffaf3;border:2px solid var(--acc);border-radius:14px;padding:2px 4px;z-index:3;cursor:pointer;animation:pl 1s infinite alternate}.bub img{width:28px;height:28px;object-fit:contain}.bub .pb{height:4px;border-radius:2px;background:var(--line);overflow:hidden}.bub .pb i{display:block;height:100%;background:var(--acc2)}.bub.no{animation:sh .3s 2}@keyframes pl{to{transform:scale(1.1)}}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fl{position:absolute;z-index:9;color:#c0645c;pointer-events:none;animation:up 1.1s forwards;text-shadow:0 1px #fff}@keyframes up{to{transform:translateY(-44px);opacity:0}}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.inv div{background:var(--soft);border-radius:14px;text-align:center;padding:4px;font-size:13px}.inv img{width:28px;height:28px;object-fit:contain;margin:0 auto}
.up{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:16px;padding:6px 8px;margin-bottom:6px}.up img{width:34px;height:34px;object-fit:contain}.up div{flex:1;font-size:14px}.up small{display:block;color:var(--mute);font-size:12px}
#log{height:120px;overflow:auto;font-size:13px;color:var(--mute)}#log div{padding:1px 0}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);background:rgba(110,80,62,.93);color:#fff;border-radius:14px;padding:6px 14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}#toast.on{opacity:1}
.ros{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.ros>div{flex:none;width:58px;text-align:center;font-size:11px;border:3px solid transparent;border-radius:14px;padding:2px;cursor:pointer;background:var(--soft)}.ros img{width:46px;height:42px;object-fit:contain;margin:0 auto}.ros .on{border-color:var(--acc2);background:var(--card)}.ros small{color:#d98a9c;display:block;font-size:10px;letter-spacing:-1px}
.chh{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:16px;padding:6px 10px}.chh img{width:84px;height:76px;object-fit:contain}.chh>div{flex:1}.chh small{color:var(--mute)}
.clog{height:160px;overflow:auto;margin:8px 0;padding:6px;border-radius:14px;background:var(--soft);font-family:"Gaegu","Jua",sans-serif;font-size:18px}.m{margin:3px 0;display:flex}.m span{padding:2px 12px;border-radius:14px;max-width:86%;background:var(--card);border:2px solid var(--line)}.m.u{justify-content:flex-end}.m.u span{background:var(--acc);color:#fff;border-color:var(--acc)}
</style></head><body><div class="wrap">
<h1>🌰 몽글 농장 카페 대시보드</h1>
<div class="stats"><div class="st" id="s1"></div><div class="st" id="s2"></div><div class="st" id="s3"></div><div class="st" id="s4"></div></div>
<div class="dash">
<div class="col">
<div class="pn"><h2>🕰 시간 · 날씨</h2><div class="clk" id="clk"></div></div>
<div class="pn"><h2>✏️ 할 일 목록</h2><div class="add"><input id="ti" maxlength="40" placeholder="할 일을 적어봐요"><button id="ta">추가</button></div><div id="tl"></div></div>
<div class="pn"><h2>📝 메모장</h2><textarea id="memo" placeholder="자유롭게 메모해요 🌰"></textarea></div>
<div class="pn"><h2>🎀 오늘의 퀘스트</h2><div id="qs"></div></div>
</div>
<div class="col mid">
<div class="pn"><h2>🌱 농장 <small style="color:var(--mute)" id="fh"></small></h2><div id="farm"><div id="deco"></div><div id="plots"></div></div><div class="fb" id="fbar"></div></div>
<div class="pn"><h2>☕ 몽글 카페</h2><div id="cafe"></div><div class="fb" id="cbar"></div></div>
<div class="pn"><h2>💬 캐릭터 친구들 <small style="color:var(--mute)">카페 손님을 눌러도 돼요</small></h2><div class="ros" id="ros"></div><div class="chh" id="chh"></div><div class="clog" id="clog"></div>
<div class="fb" id="cact"><div class="cd" data-a="talk"><div style="font-size:22px">💬</div>대화하기</div><div class="cd" data-a="pet"><div style="font-size:22px">🤲</div>쓰다듬기</div><div class="cd" data-a="feed"><div style="font-size:22px">🍪</div>간식주기</div></div>
<div class="add" style="margin:8px 0 0"><input id="ci" maxlength="60" placeholder="말을 걸어봐요 (자유롭게 대화!)"><button id="cs">보내기</button></div></div>
</div>
<div class="col">
<div class="pn"><h2>🎒 창고</h2><div class="inv" id="inv"></div></div>
<div class="pn"><h2>🛍 상점</h2><div id="ups"></div></div>
<div class="pn"><h2>📜 소식</h2><div id="log"></div></div>
</div></div></div><div id="toast"></div>

put("inv",CR.map(c=>`<div>${im(c.ic,c.k==="gold"?"gold":"")}${c.n}<br><b>${S.stock[c.k]}</b></div>`).join(""));

const q=P[cur],a=S.aff[cur]||0;put("chh",im("c"+cur)+`<div><b>${q.n}</b> <small>${q.c}</small><div class="bar"><i style="width:${a}%"></i></div><small>친밀도 ${a}/100 · 팁 +${Math.floor(a/3)}%</small></div>`)}

const P=[

{n:"루미",c:"뿔 달린 젤리",per:"장난꾸러기, 뿔을 내세우지만 속은 말랑함",like:"tomato",talk:["맛있는 거 있어?","뿔 만지지 마! …살살이면 괜찮아.","나 무섭지? 아니라고? 칫."],pet:["으앗, 뿔은 안 돼!","말랑말랑하다고 하지 마!"],feed:"토마토 새콤해! 한 입 더?",secret:"사실 뿔은 장식이야… 비밀이야."},

{n:"별이",c:"별을 안은 천사",per:"순수하고 다정함, 반짝이는 걸 좋아함",like:"sun",talk:["별 조각 하나 줄까?","오늘도 반짝이는 하루!","내 후광 만져볼래? 따끈해."],pet:["꺄하, 간지러워!","날개가 파닥파닥~"],feed:"해바라기는 햇님을 닮았어, 최고!",secret:"소원 하나 빌었어. 비밀이지만 너랑 관련 있어."},
{n:"메이",c:"졸린 메이드 고양이",per:"늘 졸리고 느릿한 말투(~냥), 서비스 정신은 투철함",like:"blue",talk:["오늘도 수고했냥…","하암… 차 한잔 올릴까냥…","졸려… zzz… 아, 안 잤다냥."],pet:["우냐… 잠 깼다냥.","그 손길… 낮잠 보장이다냥."],feed:"블루베리… 눈이 번쩍 떠졌다냥!",secret:"주인님 옆이 제일 푹 잘 수 있다냥…"},
